[workspace]
resolver = "2"
members = ["apps/desktop", "crates/domain", "crates/ports", "crates/application", "crates/infrastructure", "crates/config"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.78"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
