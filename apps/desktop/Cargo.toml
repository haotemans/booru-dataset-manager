[package]
name = "bdm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
bdm-application = { path = "../../crates/application" }
bdm-domain = { path = "../../crates/domain" }
bdm-config = { path = "../../crates/config" }
bdm-ports = { path = "../../crates/ports" }
bdm-infrastructure = { path = "../../crates/infrastructure" }
tempfile = "3"

[dev-dependencies]
md-5 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
