name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p bdm-desktop -p bdm-agent
  check-modelscope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'filelock>=3,<4' 'mcp>=1.26,<2'
      - run: python -m unittest discover -s tests -p 'test_modelscope*.py' -v
  build-windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bdm-desktop -p bdm-agent
      - name: Prepare Windows package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'bdm-windows-package'
          $scripts = Join-Path $package 'scripts'
          New-Item -ItemType Directory -Path $scripts -Force
          Copy-Item -LiteralPath target/release/bdm-desktop.exe,target/release/bdm.exe -Destination $package -Force
          Copy-Item -LiteralPath scripts/modelscope_backup.py,scripts/modelscope_catalog.py,scripts/modelscope_mcp.py -Destination $scripts -Force
          New-Item -ItemType File -Path (Join-Path $package 'portable.flag') -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: bdm-desktop-windows
          path: ${{ runner.temp }}/bdm-windows-package/
          if-no-files-found: error
